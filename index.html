<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dayi Salon | Nail Atelier</title>


<link rel="icon" type="image/jpeg" href="favicon.jpg">


<!-- GOOGLE FONTS -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Satisfy&display=swap" rel="stylesheet">



<style>


/* =================================
   DAYI SALON
   NEW YORK NAIL ATELIER
================================= */



:root{

    --cream:#FAF7F2;

    --black:#1C1C1C;

    --gold:#C9A24D;

    --rose:#E8C7C0;

    --white:#FFFFFF;

}



*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}



html{

    scroll-behavior:smooth;

}



body{


    background:var(--cream);

    color:var(--black);

    font-family:Arial, sans-serif;


}



h1,
h2,
h3{


    font-family:"Abril Fatface", serif;


}



p{


    line-height:1.7;


}



a{


    text-decoration:none;

    color:inherit;


}



/* =================================
   BUTTON
================================= */


.btn{


    display:inline-block;

    padding:15px 45px;

    border:1px solid var(--black);

    font-size:14px;

    letter-spacing:2px;

    text-transform:uppercase;

    transition:.4s;


}



.btn:hover{


    background:var(--black);

    color:white;


}



/* =================================
   HERO
================================= */


.hero{


    min-height:100vh;

    display:grid;

    grid-template-columns:1fr 1fr;

    align-items:center;

    padding:80px 8%;


}



/* LEFT */


.hero-content{


    max-width:550px;


}



.brand{


    font-family:"Abril Fatface", serif;

    font-size:90px;

    letter-spacing:4px;

    line-height:1;


}



.subtitle{


    font-family:"Satisfy", cursive;

    font-size:42px;

    color:var(--gold);

    margin:25px 0;


}



.hero-text{


    font-size:18px;

    max-width:430px;

    margin-bottom:40px;


}




/* IMAGE */


.hero-image{


    height:750px;

    overflow:hidden;


}



.hero-image img{


    width:100%;

    height:100%;

    object-fit:cover;


}



/* =================================
   BUTTERFLY
================================= */


.butterfly{


    width:70px;

    margin-bottom:25px;


}






/* =================================
   GALLERY
================================= */


.gallery{


    padding:120px 8%;


}



.section-title{


    text-align:center;

    font-size:55px;

    margin-bottom:70px;


}



.section-subtitle{


    text-align:center;

    font-family:"Satisfy", cursive;

    font-size:35px;

    color:var(--gold);

    margin-top:-50px;

    margin-bottom:70px;


}



.gallery-grid{


    display:grid;

    grid-template-columns:

    repeat(12,1fr);

    gap:25px;


}



.gallery-item{


    overflow:hidden;


}



.gallery-item img{


    width:100%;

    height:100%;

    object-fit:cover;

    transition:.5s;


}



.gallery-item:hover img{


    transform:scale(1.05);


}



/* tamaños revista */


.big{


    grid-column:span 7;

    height:600px;


}



.medium{


    grid-column:span 5;

    height:400px;


}



.small{


    grid-column:span 4;

    height:350px;


}



/* =================================
   MOBILE
================================= */


@media(max-width:900px){



.hero{


grid-template-columns:1fr;

text-align:center;


}



.brand{


font-size:55px;


}



.hero-image{


height:500px;

margin-top:40px;


}



.gallery-grid{


display:block;


}



.gallery-item{


height:350px;

margin-bottom:25px;


}



}





</style>


</head>



<body>



<!-- =================================
     HERO
================================= -->


<section class="hero">



<div class="hero-content">


<img src="img/mariposacr.GIF"
class="butterfly"
alt="Mariposa">



<h1 class="brand">

DAYI<br>
SALON

</h1>



<div class="subtitle">

Beauty that becomes your signature

</div>



<p class="hero-text">

La belleza comienza en los detalles.
Diseños personalizados para mujeres
que quieren sentirse únicas.

</p>



<a href="#booking" class="btn">

Reservar cita

</a>



</div>





<div class="hero-image">


<img src="img/nail-main.jpg"
alt="Diseño de uñas elegante">


</div>




</section>







<!-- =================================
     GALLERY
================================= -->


<section class="gallery">


<h2 class="section-title">

Creaciones

</h2>



<div class="section-subtitle">

Arte creado en cada detalle

</div>




<div class="gallery-grid">



<div class="gallery-item big">

<img src="img/nail1.jpg"
alt="Nail Art">

</div>




<div class="gallery-item medium">

<img src="img/nail2.jpg"
alt="Gel X">

</div>




<div class="gallery-item small">

<img src="img/nail3.jpg"
alt="Manicure">

</div>



<div class="gallery-item small">

<img src="img/nail4.jpg"
alt="Diseño personalizado">

</div>



</div>


</section>
